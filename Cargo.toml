[workspace]
members = [
    "apps/echobot",
    "apps/groupbot",
    "apps/nodes",
    "sync",
    "tox-proto",
    "tox-proto-derive",
    "tox-sys",
    "toxcore",
    "toxxi",
]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
nodes = { path = "apps/nodes" }
tox-proto = { path = "tox-proto" }
tox-proto-derive = { path = "tox-proto-derive" }
tox-sync = { path = "sync" }
tox-sys = { path = "tox-sys" }
toxcore = { path = "toxcore" }

base64 = "0.22.1"
bindgen = "0.72"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.5.53", features = ["derive"] }
criterion = "0.8.1"
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.31"
hex = "0.4.3"
insta = "1.45.1"
pkg-config = "0.3"
proc-macro2 = "1.0.106"
proptest = "1.9.0"
proptest-derive = "0.7.0"
qoi = "0.4.1"
qrcode = "0.14.1"
quote = "1.0.45"
rand = "0.8.5"
ratatui = "0.30.0"
regex = "1.12.2"
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
resvg = "0.45.1"
rhai = { version = "1.23.6", features = ["sync"] }
rmp = "0.8.15"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.147"
sha2 = "0.11.1"
syn = "2.0.117"
tempfile = "3.24.0"
tiny-skia = "0.11.4"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
