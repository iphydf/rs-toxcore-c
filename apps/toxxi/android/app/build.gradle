plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The native library comes from ../build-native.sh, into src/main/jniLibs.

android {
    namespace 'chat.tox.toxxi'
    compileSdk 35

    defaultConfig {
        applicationId 'chat.tox.toxxi'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
